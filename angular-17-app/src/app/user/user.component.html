<section>
@if (isLoggedIn) {
    <p>Bienvenido {{username}}</p>
    <img 
    (click)="greet()"
    src="https://github.com/KeVVuN.png" 
    alt="photo">
    <app-games (addFavoriteEvent)="getFavorite($event)" username="{{ username }}"/>
    @if (favGame !== ''){
        <p>El juego favorito de {{username}} es {{favGame}}</p>
    }
    <button (click)="isLoggedIn= false">Logout</button>

} @else {
    <p>Inicia Sesión!</p>
    <button (click)="isLoggedIn= true">Login</button>
}


</section>
